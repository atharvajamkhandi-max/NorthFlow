name: Scheduled NSE Bhavcopy Pipeline

on:
  schedule:
    # Checkpoints at 20:00, 21:00, 22:00 IST on weekdays (Monday to Friday)
    # 20:00 IST = 14:30 UTC (Primary scheduled run)
    # 21:00 IST = 15:30 UTC (Catchup run if NSE publishes late)
    # 22:00 IST = 16:30 UTC (Final catchup run)
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Target Trade Date (YYYY-MM-DD)'
        required: false
      force:
        description: 'Force re-ingestion'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: "Asia/Kolkata"


jobs:
  ingest-and-validate:
    name: Candidate Ingestion & Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 4-Checkpoint Pipeline
        run: |
          python scripts/daily_update.py ${{ github.event.inputs.trade_date && format('--date {0}', github.event.inputs.trade_date) || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Optimize & Vacuum Database
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('data/market_flow.db'); conn.execute('VACUUM;'); conn.close()"

      - name: Run Integrity & Release Gates on Updated Dataset
        run: |
          python -m pytest tests/test_canonical_v3_2_unification.py -q


      - name: Atomic Commit & Push Validated Production Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_flow.db
          if git diff --staged --quiet; then
            echo "No database changes to commit (Idempotent / No-op)."
          else
            git commit -m "chore(data): automated bhavcopy daily update [skip ci]"
            git push origin main
            echo "Successfully promoted validated dataset to production."
          fi

